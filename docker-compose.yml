services:
  postgres:
    image: postgres:16
    container_name: bookmark-manager-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bookmark_user
      POSTGRES_PASSWORD: bookmark_local_2026
      POSTGRES_DB: bookmark_manager
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: